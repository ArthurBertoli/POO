# Configuração do banco de dados PostgreSQL do Controle de Gastos.
#
# O programa procura este arquivo na pasta de trabalho atual ou na pasta do projeto
# (Trabalho2/Trabalho2). Também é possível indicar outro arquivo com -Ddb.config=caminho.
#
# Se o banco não estiver acessível, ou se o driver JDBC (lib/postgresql-<versão>.jar)
# não estiver no classpath, o programa avisa e funciona em modo memória.
#
# NÃO grave sua senha real neste arquivo se for publicá-lo no Git.

# true = tenta usar o PostgreSQL; false = usa apenas a memória, sem aviso.
db.enabled=true
db.url=jdbc:postgresql://localhost:5432/trab3
db.user=postgres
db.password=SUA_SENHA_AQUI
# Tempo máximo (em segundos) para tentar conectar.
db.timeout=5
